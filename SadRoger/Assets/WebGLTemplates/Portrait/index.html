<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
        @font-face {
            font-family: "LiberationSans";
            src: url("TemplateData/LiberationSans.ttf") format("truetype");
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #stage {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            container-type: size;
        }

        /* Mouse as the primary pointer (desktop): portrait column over the full height. */
        @media (pointer: fine) {
            #game {
                width: min(100%, calc(100vh * 9 / 19.5));
                width: min(100%, calc(100dvh * 9 / 19.5));
            }
        }

        #unity-canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
            background: #231F20;
        }

        /* Mirrors the LoadingScreen prefab: 1080 x 1920 reference, scaled by width. */
        #overlay {
            --unit: calc(100cqw / 1080);
            --text-color: #FFFFFF;
            position: absolute;
            inset: 0;
            background: #231F20;
            font-family: "LiberationSans", Arial, sans-serif;
            transition: opacity 0.35s ease-out;
        }

        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #play-button {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            padding: calc(var(--unit) * 36) calc(var(--unit) * 96);
            font-family: inherit;
            font-size: calc(var(--unit) * 64);
            color: var(--text-color);
            background: transparent;
            border: calc(var(--unit) * 6) solid var(--text-color);
            border-radius: calc(var(--unit) * 28);
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        #play-button:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translate(-50%, -50%) scale(1.05);
        }

        #play-button:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        #loading {
            display: none;
        }

        #loading > * {
            position: absolute;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #logo {
            top: calc(50% - var(--unit) * 34);
            width: calc(var(--unit) * 154);
            height: calc(var(--unit) * 130);
        }

        #progress-bar {
            top: calc(50% + var(--unit) * 50);
            width: calc(var(--unit) * 141);
            height: calc(var(--unit) * 18);
            background: url("TemplateData/ProgressBar_Empty.png") center / 100% 100% no-repeat;
        }

        #progress-fill {
            width: 0%;
            height: 100%;
            background: url("TemplateData/ProgressBar_Full.png") left center / calc(var(--unit) * 141) 100% no-repeat;
        }

        #progress-text {
            top: calc(50% + var(--unit) * 84);
            font-size: calc(var(--unit) * 24);
            color: var(--text-color);
            white-space: nowrap;
        }
    </style>
</head>
<body>
<div id="stage">
    <div id="game">
        <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
        <div id="overlay">
            <button id="play-button"></button>
            <div id="loading">
                <img id="logo" src="TemplateData/UnityLogo.png" alt="">
                <div id="progress-bar">
                    <div id="progress-fill"></div>
                </div>
                <div id="progress-text">0%</div>
            </div>
        </div>
    </div>
</div>

<script src="Build/{{{ LOADER_FILENAME }}}"></script>
<script>
    var FadeOutDuration = 350;
    var PlayLabels = { ru: "ИГРАТЬ", en: "PLAY" };

    var stage = document.querySelector("#stage");
    var canvas = document.querySelector("#unity-canvas");
    var overlay = document.querySelector("#overlay");
    var playButton = document.querySelector("#play-button");
    var loading = document.querySelector("#loading");
    var progressFill = document.querySelector("#progress-fill");
    var progressText = document.querySelector("#progress-text");
    var isStarted = false;

    var language = (navigator.language || "en").slice(0, 2).toLowerCase();
    document.documentElement.lang = PlayLabels[language] ? language : "en";
    playButton.textContent = PlayLabels[language] || PlayLabels.en;

    // The game starts on click so the user gesture unlocks audio (FMOD / WebAudio).
    playButton.addEventListener("click", function () {
        playButton.style.display = "none";
        loading.style.display = "block";

        if (window.matchMedia("(pointer: coarse)").matches) {
            enterFullscreenPortrait();
        }

        createUnityInstance(canvas, {
            arguments: [],
            dataUrl: "Build/{{{ DATA_FILENAME }}}",
            frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
            codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
            symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
            streamingAssetsUrl: "StreamingAssets",
            companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
            productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
            productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        }, function (value) {
            var percent = Math.round(100 * value);
            progressFill.style.width = percent + "%";
            progressText.textContent = percent + "%";
        }).then(function () {
            isStarted = true;
            canvas.focus();
            hideOverlay();
        }).catch(function (message) {
            alert(message);
        });
    });

    function hideOverlay() {
        overlay.classList.add("hidden");

        setTimeout(function () {
            overlay.remove();
        }, FadeOutDuration);
    }

    function enterFullscreenPortrait() {
        var root = document.documentElement;

        if (!root.requestFullscreen) {
            return;
        }

        root.requestFullscreen().then(function () {
            if (screen.orientation && screen.orientation.lock) {
                return screen.orientation.lock("portrait");
            }
        }).catch(function () {
        });
    }

    // Keeps the drag alive when the cursor leaves the canvas.
    canvas.addEventListener("pointerdown", function (event) {
        canvas.setPointerCapture(event.pointerId);
    });

    // A press on the side bars is replayed on the canvas, so the drag controls the game from there too.
    stage.addEventListener("pointerdown", function (event) {
        if (!isStarted || event.target === canvas) {
            return;
        }

        canvas.dispatchEvent(new PointerEvent("pointerdown", event));
        canvas.dispatchEvent(new MouseEvent("mousedown", event));
        canvas.setPointerCapture(event.pointerId);
        canvas.focus();
    });
</script>
</body>
</html>
